name: Build OS ISO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt update && sudo apt install -y xorriso wget

      - name: Download Alpine ISO
        run: wget https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-standard-3.20.3-x86_64.iso

      - name: Prepare overlay
        run: |
          mkdir -p overlay/etc/local.d overlay/etc/runlevels/default overlay/root
          cp os_constructor.py overlay/root/
          printf '#!/bin/sh\nexec /usr/bin/python3 /root/os_constructor.py\n' > overlay/etc/local.d/os.start
          chmod +x overlay/etc/local.d/os.start
          touch overlay/etc/.default_boot_services
          ln -sf /etc/init.d/local overlay/etc/runlevels/default/local
          cd overlay && tar --owner=0 --group=0 -czf ../my-os.apkovl.tar.gz . && cd ..

      - name: Build ISO
        run: |
          xorriso -indev alpine-standard-3.20.3-x86_64.iso \
                  -outdev os-constructor.iso \
                  -map my-os.apkovl.tar.gz /my-os.apkovl.tar.gz \
                  -boot_image any replay

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: os-constructor-iso
          path: os-constructor.iso
