name: Build OS ISO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt update && sudo apt install -y xorriso wget

      - name: Download Alpine ISO
        run: wget https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-standard-3.20.3-x86_64.iso

      - name: Prepare overlay with local Python packages
        run: |
          mkdir -p overlay/root/pkgs overlay/etc
          cp os_constructor.py overlay/root/

          wget https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.3-x86_64.tar.gz
          mkdir -p /tmp/chroot
          sudo tar -xzf alpine-minirootfs-3.20.3-x86_64.tar.gz -C /tmp/chroot

          sudo cp /etc/resolv.conf /tmp/chroot/etc/resolv.conf

          sudo mkdir -p /tmp/chroot/tmp/pkgs

          sudo chroot /tmp/chroot /bin/sh -c "apk update && apk fetch -R -o /tmp/pkgs python3"

          sudo cp /tmp/chroot/tmp/pkgs/*.apk overlay/root/pkgs/
          sudo chown -R $USER:$USER overlay

          cat > overlay/root/start.sh << 'EOF'
          #!/bin/sh
          clear
          echo "Starting OS Constructor..."

          if ! command -v python3 >/dev/null 2>&1; then
              echo "Installing Python locally..."
              apk add --allow-untrusted /root/pkgs/*.apk
          fi

          clear
          exec /usr/bin/python3 /root/os_constructor.py
          EOF

          chmod +x overlay/root/start.sh

          cat > overlay/etc/inittab << 'EOF'
          ::sysinit:/sbin/openrc sysinit
          ::sysinit:/sbin/openrc boot
          ::wait:/sbin/openrc default
          tty1::respawn:/sbin/getty -n -l /root/start.sh 38400 tty1
          tty2::respawn:/sbin/getty 38400 tty2
          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/openrc shutdown
          EOF

          cd overlay && tar --owner=0 --group=0 -czf ../localhost.apkovl.tar.gz . && cd ..

      - name: Build ISO
        run: |
          xorriso -indev alpine-standard-3.20.3-x86_64.iso \
                  -outdev os-constructor.iso \
                  -map localhost.apkovl.tar.gz /localhost.apkovl.tar.gz \
                  -boot_image any replay

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: os-constructor-iso
          path: os-constructor.iso
