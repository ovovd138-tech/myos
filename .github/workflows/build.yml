name: Build OS ISO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt update && sudo apt install -y xorriso wget

      - name: Download Alpine ISO
        run: wget https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-standard-3.20.3-x86_64.iso

      - name: Prepare overlay with Python
        run: |
          # Создаем структуру папок
          mkdir -p overlay/root overlay/etc
          cp os_constructor.py overlay/root/
          
          # МАГИЯ: Запускаем контейнер Alpine, скачиваем Python и распаковываем его прямо в наш оверлей
          docker run --rm -v "$(pwd)/overlay:/overlay" alpine:3.20 sh -c "
            # Пересоздаем каталог кэша, чтобы избежать ошибки 'Bad file descriptor'
            rm -rf /var/cache/apk && mkdir -p /var/cache/apk
            
            # Добавляем флаг --no-cache для надежности
            apk update --no-cache
            apk fetch -R --no-cache -o /tmp/pkgs python3
            
            # Проверяем, что файлы действительно скачались
            if [ -z \"\$(ls -A /tmp/pkgs/*.apk 2>/dev/null)\" ]; then
              echo 'ERROR: No packages downloaded!'
              exit 1
            fi
            
            for f in /tmp/pkgs/*.apk; do tar -xzf \$f -C /overlay; done
          "

          # Создаем простой скрипт запуска (без интернета и ожиданий)
          cat > overlay/root/start.sh << 'EOF'
          #!/bin/sh
          clear
          echo "Starting OS Constructor..."
          sleep 1
          clear
          exec /usr/bin/python3 /root/os_constructor.py
          EOF
          
          chmod +x overlay/root/start.sh

          # Отключаем экран логина
          cat > overlay/etc/inittab << 'EOF'
          ::sysinit:/sbin/openrc sysinit
          ::sysinit:/sbin/openrc boot
          ::wait:/sbin/openrc default
          tty1::respawn:/sbin/getty -n -l /root/start.sh 38400 tty1
          tty2::respawn:/sbin/getty 38400 tty2
          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/openrc shutdown
          EOF

          # Упаковываем всё в архив
          cd overlay && tar --owner=0 --group=0 -czf ../localhost.apkovl.tar.gz . && cd ..

      - name: Build ISO
        run: |
          xorriso -indev alpine-standard-3.20.3-x86_64.iso \
                  -outdev os-constructor.iso \
                  -map localhost.apkovl.tar.gz /localhost.apkovl.tar.gz \
                  -boot_image any replay

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: os-constructor-iso
          path: os-constructor.iso
