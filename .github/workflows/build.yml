name: Build Debian ISO with EXE support
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget xorriso squashfs-tools isolinux syslinux-utils

      - name: Download Debian Live ISO
        run: wget https://cdimage.debian.org/cdimage/archive/12.12.0-live/amd64/iso-hybrid/debian-live-12.12.0-amd64-standard.iso

      - name: Extract ISO and Squashfs
        run: |
          mkdir -p extracted_iso
          sudo mount -o loop debian-live-12.12.0-amd64-standard.iso extracted_iso
          sudo cp -r extracted_iso ./iso_files
          sudo umount extracted_iso
          
          # Удаляем старую папку (если осталась) и распаковываем систему
          sudo rm -rf squashfs
          sudo unsquashfs iso_files/live/filesystem.squashfs

      - name: Customize System (Python, Wine, Auto-login)
        run: |
          # 1. ПРИНУДИТЕЛЬНО создаем папку root и копируем скрипт
          sudo mkdir -p squashfs/root
          sudo cp os_constructor.py squashfs/root/
          
          # 2. КОПИРУЕМ DNS, чтобы интернет работал внутри системы
          sudo cp /etc/resolv.conf squashfs/etc/resolv.conf
          
          # 3. Монтируем системные папки
          sudo mount --bind /dev squashfs/dev
          sudo mount --bind /proc squashfs/proc
          sudo mount --bind /sys squashfs/sys
          
          # 4. Устанавливаем Python и Wine
          sudo chroot squashfs /bin/bash -c "
            echo 'deb http://deb.debian.org/debian bookworm main contrib non-free' > /etc/apt/sources.list
            apt-get update
            apt-get install -y python3 wine64
          "
          
          # 5. Настраиваем автологин (вход без пароля)
          sudo mkdir -p squashfs/etc/systemd/system/getty@tty1.service.d
          sudo tee squashfs/etc/systemd/system/getty@tty1.service.d/autologin.conf << 'EOF'
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          EOF

          # 6. Настраиваем автозапуск твоего меню при входе
          sudo tee squashfs/root/.profile << 'EOF'
          if [ "$(tty)" = "/dev/tty1" ]; then
              python3 /root/os_constructor.py
              logout
          fi
          EOF

          # 7. Отмонтируем папки (чтобы не было ошибок при сборке)
          sudo umount squashfs/dev squashfs/proc squashfs/sys

      - name: Repack ISO
        run: |
          # 1. Запаковываем систему обратно
          sudo mksquashfs squashfs iso_files/live/filesystem.squashfs -comp xz -e boot
          
          # 2. Собираем финальный ISO
          cd iso_files
          xorriso -as mkisofs \
            -r -V "DEBIAN_CUSTOM" \
            -o ../my-debian-os.iso \
            -J -J -joliet-long \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -partition_offset 16 \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debian-os-iso
          path: my-debian-os.iso
