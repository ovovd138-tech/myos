name: Build OS ISO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt update && sudo apt install -y xorriso wget

      - name: Download Alpine ISO
        run: wget https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-standard-3.20.3-x86_64.iso

      - name: Prepare overlay
        run: |
          mkdir -p overlay/etc/apk
          mkdir -p overlay/root

          # Копируем твой скрипт
          cp os_constructor.py overlay/root/

          # Прописываем репозитории Alpine (чтобы было откуда качать Python)
          echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/main" > overlay/etc/apk/repositories
          echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/community" >> overlay/etc/apk/repositories

          # Создаем умный скрипт запуска
          cat > overlay/root/start.sh << 'EOF'
          #!/bin/sh
          # Проверяем, установлен ли Python. Если нет — ставим.
          if ! command -v python3 >/dev/null 2>&1; then
              echo "=== ПЕРВЫЙ ЗАПУСК: ПОДГОТОВКА СИСТЕМЫ ==="
              echo "Ожидание подключения к интернету..."
              echo "(Если это длится долго, проверьте сеть в виртуалке)"
              while ! ping -c 1 -W 1 8.8.8.8 >/dev/null 2>&1; do
                  sleep 1
              done
              echo ""
              echo "Интернет есть! Скачиваем Python 3 (около 10-15 секунд)..."
              apk update
              apk add python3
              clear
          fi
          echo "Запуск ОС-Конструктора..."
          # Запускаем твой скрипт
          exec /usr/bin/python3 /root/os_constructor.py
          EOF
          chmod +x overlay/root/start.sh

          # Подменяем системный файл inittab, чтобы отключить экран логина
          cat > overlay/etc/inittab << 'EOF'
          ::sysinit:/sbin/openrc sysinit
          ::sysinit:/sbin/openrc boot
          ::wait:/sbin/openrc default

          # Автоматический запуск нашего скрипта на главном экране
          tty1::respawn:/sbin/getty -n -l /root/start.sh 38400 tty1
          tty2::respawn:/sbin/getty 38400 tty2

          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/openrc shutdown
          EOF

          # Упаковываем всё в архив
          cd overlay && tar --owner=0 --group=0 -czf ../localhost.apkovl.tar.gz . && cd ..

      - name: Build ISO
        run: |
          xorriso -indev alpine-standard-3.20.3-x86_64.iso \
                  -outdev os-constructor.iso \
                  -map localhost.apkovl.tar.gz /localhost.apkovl.tar.gz \
                  -boot_image any replay

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: os-constructor-iso
          path: os-constructor.iso
